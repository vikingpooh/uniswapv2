# Host build scripts (proc macros) need a C linker. This machine has no system
# gcc; the Zig toolchain in .bin supplies `cc`.
[target.x86_64-unknown-linux-gnu]
linker = "/home/phoenix/Documents/substream/.bin/zigcc"

[env]
CC = { value = "/home/phoenix/Documents/substream/.bin/zigcc", force = true }
PROTOC = { value = "/home/phoenix/Documents/substream/.bin/protoc/bin/protoc", force = true }
